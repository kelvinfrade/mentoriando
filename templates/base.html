<!DOCTYPE html>
<html lang="pt-br" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitorando</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <style>
        html.light {
            --bg-primary: #f8fafc;
            --bg-secondary: #e2e8f0;
            --bg-card: #ffffff;
            --text-primary: #172033;
            --text-secondary: #526071;
            --border-color: #cbd5e1;
            --field-bg: #ffffff;
            --header-bg: #ffffff;
        }

        html.dark {
            --bg-primary: #07111f;
            --bg-secondary: #0f1d31;
            --bg-card: #14243a;
            --text-primary: #f3f7fb;
            --text-secondary: #a8b5c7;
            --border-color: #30435c;
            --field-bg: #0d1a2c;
            --header-bg: #0b1728;
        }

        html, body {
            min-height: 100%;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header#navbar-header,
        header.app-navbar {
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .theme-bg-primary { background-color: var(--bg-primary) !important; }
        .theme-bg-secondary { background-color: var(--bg-secondary) !important; }
        .theme-bg-card { background-color: var(--bg-card) !important; }
        .theme-text-primary { color: var(--text-primary) !important; }
        .theme-text-secondary { color: var(--text-secondary) !important; }
        .theme-border { border-color: var(--border-color) !important; }

        html.light [class*="bg-[#040e1b]"],
        html.light [class*="bg-[#05101d]"],
        html.light .bg-slate-900,
        html.light .bg-slate-950,
        html.light .bg-gray-900 {
            background-color: var(--bg-primary) !important;
        }

        html.light [class*="bg-[#0b1526]"] {
            background-color: var(--bg-card) !important;
        }

        html.light .bg-gray-800 {
            background-color: var(--bg-card) !important;
        }

        html.dark [class*="bg-[#040e1b]"],
        html.dark [class*="bg-[#05101d]"] {
            background-color: var(--bg-primary) !important;
        }

        html.light #navbar-header,
        html.light #mobile-menu {
            background-color: var(--header-bg) !important;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.1);
        }

        html.dark #navbar-header,
        html.dark #mobile-menu {
            background-color: var(--header-bg) !important;
        }

        html.light .text-gray-100,
        html.light .text-gray-200,
        html.light .text-white {
            color: var(--text-primary) !important;
        }

        html.light .text-gray-400,
        html.light .text-gray-500 {
            color: var(--text-secondary) !important;
        }

        html.light .bg-white\/5,
        html.light .bg-gray-700\/40 {
            background-color: var(--field-bg) !important;
        }

        html.light .border-white\/10,
        html.light .border-gray-600,
        html.light .ring-white\/10 {
            border-color: var(--border-color) !important;
            --tw-ring-color: var(--border-color) !important;
        }

        html.light .divide-white\/5 > :not(:last-child) {
            border-color: var(--border-color) !important;
        }

        input,
        select,
        textarea {
            background-color: var(--field-bg);
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        html.light input[type="text"],
        html.light input[type="password"],
        html.light input[type="file"],
        html.light input[type="datetime-local"],
        html.light select,
        html.light textarea {
            background-color: var(--field-bg) !important;
            color: var(--text-primary) !important;
            border: 1px solid var(--border-color) !important;
        }

        html.light option {
            background-color: var(--bg-card) !important;
            color: var(--text-primary) !important;
        }

        .global-theme-toggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 60;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 0.5rem 0.75rem;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
        }

    </style>

    <!-- Inicializar tema antes da renderização para evitar flash -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.className = savedTheme;
        })();
    </script>

    {% block 'head' %}{% endblock 'head' %}
</head>
<body class="theme-bg-primary theme-text-primary">
    <button type="button" class="global-theme-toggle" onclick="toggleTheme()" title="Alternar tema" aria-label="Alternar tema">
        <span id="global-theme-icon">Tema</span>
    </button>
    {% block 'body' %}{% endblock 'body' %}

    <script>
        // Menu mobile toggle
        const menuToggle = document.getElementById('menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');
        
        if (menuToggle && mobileMenu) {
            menuToggle.addEventListener('click', function() {
                mobileMenu.classList.toggle('hidden');
            });

            menuToggle.addEventListener('mouseover', function() {
                menuToggle.style.backgroundColor = 'rgba(255,255,255,0.1)';
            });

            menuToggle.addEventListener('mouseout', function() {
                menuToggle.style.backgroundColor = '';
            });
        }

        const menuItems = document.querySelectorAll('.menu-item');
        menuItems.forEach(item => {
            item.addEventListener('mouseover', function() {
                item.style.backgroundColor = 'rgba(255,255,255,0.05)';
            });

            item.addEventListener('mouseout', function() {
                item.style.backgroundColor = '';
            });
        });

        // Theme toggle
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.classList.contains('light') ? 'light' : 'dark';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            html.className = newTheme;
            localStorage.setItem('theme', newTheme);
            updateThemeIcons(newTheme);
        }

        function updateThemeIcons(theme) {
            const sunIcon = document.getElementById('theme-icon-sun');
            const moonIcon = document.getElementById('theme-icon-moon');
            const mobileThemeIcon = document.getElementById('mobile-theme-icon');
            
            if (sunIcon && moonIcon) {
                if (theme === 'light') {
                    sunIcon.classList.remove('hidden');
                    moonIcon.classList.add('hidden');
                } else {
                    sunIcon.classList.add('hidden');
                    moonIcon.classList.remove('hidden');
                }
            }
            
            if (mobileThemeIcon) {
                mobileThemeIcon.textContent = theme === 'light' ? '☀️' : '🌙';
            }

            const globalThemeIcon = document.getElementById('global-theme-icon');
            if (globalThemeIcon) {
                globalThemeIcon.textContent = theme === 'light' ? 'Modo escuro' : 'Modo claro';
                globalThemeIcon.parentElement.style.display = document.getElementById('navbar-header') ? 'none' : 'block';
            }
        }

        // Inicializar ícones no carregamento
        updateThemeIcons(localStorage.getItem('theme') || 'light');
    </script>
</body>
</html>
