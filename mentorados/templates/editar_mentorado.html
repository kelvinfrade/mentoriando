{% extends "base.html" %}
{% load static %}

{% block 'body' %}
{% include 'partials/_navbar_mentor.html' %}

<div class="theme-bg-primary min-h-screen">
    <div class="mx-auto max-w-3xl px-4 py-10 sm:px-6 lg:px-8">
        <div class="theme-bg-card rounded-lg p-6 shadow-lg">
            <div class="flex items-center justify-between gap-4">
                <div>
                    <h1 class="text-2xl font-bold theme-text-primary">Editar mentorado</h1>
                    <p class="mt-1 text-sm theme-text-secondary">Atualize os dados de {{ mentorado.nome }}.</p>
                </div>
                <a href="{% url 'mentorados' %}" class="rounded bg-slate-600 px-3 py-2 text-sm font-semibold text-white hover:bg-slate-500">Voltar</a>
            </div>

            <form action="{% url 'editar_mentorado' mentorado.id %}" method="POST" enctype="multipart/form-data" class="mt-8 space-y-5">
                {% csrf_token %}
                <div>
                    <label for="nome" class="block text-sm font-medium theme-text-primary">Nome</label>
                    <input type="text" name="nome" id="nome" value="{{ mentorado.nome }}" required class="mt-2 block w-full rounded-md px-3 py-2 outline outline-1 outline-offset-[-1px]">
                </div>

                <div>
                    <label for="estagio" class="block text-sm font-medium theme-text-primary">Estágio</label>
                    <select name="estagio" id="estagio" required class="mt-2 block w-full rounded-md px-3 py-2 outline outline-1 outline-offset-[-1px]">
                        {% for estagio in estagios %}
                            <option value="{{ estagio.0 }}" {% if mentorado.estagio == estagio.0 %}selected{% endif %}>{{ estagio.1 }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label for="navigator" class="block text-sm font-medium theme-text-primary">Navigator</label>
                    <select name="navigator" id="navigator" class="mt-2 block w-full rounded-md px-3 py-2 outline outline-1 outline-offset-[-1px]">
                        <option value="">Sem navigator</option>
                        {% for navigator in navigators %}
                            <option value="{{ navigator.id }}" {% if mentorado.navigator_id == navigator.id %}selected{% endif %}>{{ navigator.nome }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label for="foto" class="block text-sm font-medium theme-text-primary">Foto (opcional)</label>
                    <input type="file" name="foto" id="foto" accept="image/*" class="mt-2 block w-full rounded-md px-3 py-2 outline outline-1 outline-offset-[-1px]">
                </div>

                <div class="rounded-md bg-slate-100 p-3 text-sm text-slate-700 dark:bg-slate-800 dark:text-slate-200">
                    Código de acesso: <code>{{ mentorado.token }}</code>
                </div>

                <button type="submit" class="w-full rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white hover:bg-indigo-500">Salvar alterações</button>
            </form>
        </div>
    </div>
</div>
{% endblock 'body' %}
