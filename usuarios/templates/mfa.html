{% extends "base.html" %}
{% block 'body' %}
<main class="mx-auto max-w-xl px-6 py-12">
  <h1 class="text-2xl font-bold">Ativar autenticação em dois fatores</h1>
  <p class="mt-4">Adicione esta chave ao seu aplicativo autenticador e informe o código gerado.</p>
  <code class="mt-4 block rounded bg-gray-100 p-4">{{ chave_mfa }}</code>
  <p class="mt-4 text-sm">URI para importar no aplicativo autenticador:</p>
  <code class="mt-2 block break-all rounded bg-gray-100 p-4 text-xs">{{ uri_mfa }}</code>
  <form method="post" class="mt-6">{% csrf_token %}<label for="codigo">Código de 6 dígitos</label><input id="codigo" name="codigo" required inputmode="numeric" maxlength="6" class="mt-2 block w-full rounded border p-2"><button class="mt-4 rounded bg-indigo-600 px-4 py-2 text-white">Ativar MFA</button></form>
</main>
{% endblock 'body' %}
